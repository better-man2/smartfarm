# ============================================================
# 智慧农业精准灌溉系统 - 公共配置
# ============================================================
spring.application.name=SmartFarm

server.port=8081
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 默认使用 dev(内嵌 H2) 环境，开箱即跑；
# 切换 MySQL: --spring.profiles.active=mysql 并填写 application-mysql.properties 中的账号密码
spring.profiles.active=dev

# ---------- 会话 ----------
server.servlet.session.timeout=120m

# ---------- 静态资源 ----------
spring.web.resources.static-locations=classpath:/static/,classpath:/public/
spring.mvc.static-path-pattern=/**
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ---------- 文件上传 ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- MyBatis ----------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.smartfarm.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ---------- 日志 ----------
logging.level.com.example.smartfarm=info
logging.level.com.example.smartfarm.mapper=debug

# ---------- 业务参数 ----------
# 传感器数据有效期(分钟)：超过该时长视为"数据陈旧"，自动灌溉不会据此执行
smartfarm.sensor.valid-minutes=30
# 自动灌溉冷却期(分钟)：同一地块两次自动灌溉的最小间隔，防止反复浇水
smartfarm.auto-irrigation.cooldown-minutes=20
# 设备离线判定(分钟)：超过该时长未上报心跳即判定离线
smartfarm.device.offline-minutes=30
# 告警去重窗口(分钟)：同地块同指标在该窗口内只产生一条同级告警
smartfarm.alarm.dedup-minutes=30
# 自动灌溉巡检间隔(毫秒)
smartfarm.auto-irrigation.scan-interval=60000
# 设备离线巡检间隔(毫秒)
smartfarm.device.check-interval=300000
