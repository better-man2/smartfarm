# ============================================================
# 开发环境：内嵌 H2（MODE=MySQL 兼容方言），无需安装数据库
# 数据保存在内存中，重启即重置为种子数据
# ============================================================
spring.datasource.url=jdbc:h2:mem:smart_farm;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 启动时自动执行建表脚本（脚本可重复执行，两边数据库通用）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# H2 控制台: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 开发环境禁用静态资源缓存，前端改动后刷新页面即可生效
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.no-cache=true

# 开发环境开启传感器数据模拟采集，便于演示自动灌溉与告警
smartfarm.simulator.enabled=true
# 模拟采集间隔(毫秒)
smartfarm.simulator.interval=60000
