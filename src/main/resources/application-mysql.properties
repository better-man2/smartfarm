# ============================================================
# MySQL 环境：--spring.profiles.active=mysql
# 请按本机实际情况修改下面的账号密码
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_farm?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 首次启动自动建表（脚本使用 CREATE TABLE IF NOT EXISTS，可重复执行）
# 若数据库账号无建表权限，请手动导入 src/main/resources/db/schema.sql 后改为 never
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# 生产环境默认关闭数据模拟器，由真实设备上报数据
smartfarm.simulator.enabled=false
